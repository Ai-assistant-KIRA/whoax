name = "whoax-voice-token"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Per-IP limit on new calls: 4 tokens per minute per visitor.
[[ratelimits]]
name = "CALL_LIMITER"
namespace_id = "1001"
simple = { limit = 4, period = 60 }

# The Deepgram key is a secret, never a var in this file:
#   npx wrangler secret put DEEPGRAM_API_KEY
